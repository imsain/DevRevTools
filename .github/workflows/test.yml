name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The vendored copies under plugins/*/lib/shared are generated, and nothing
  # at runtime would notice if one had been edited in place instead.
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: node scripts/sync-shared.mjs --check

  uidiff:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The floor package.json claims, so the suite proves it.
          node-version: '22.0'

      - name: Install ImageMagick
        run: brew install imagemagick

      - run: npm test
        working-directory: plugins/uidiff

  datadiff:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22 is the floor package.json claims. TypeScript function targets
        # additionally need a Node that strips types, which 22.0 does not and
        # 22.18 and 24 do — so those tests skip themselves on the floor.
        # Testing one version would mean dropping either the floor or
        # TypeScript.
        node-version: ['22.0', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm test
        working-directory: plugins/datadiff
