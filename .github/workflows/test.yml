name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The vendored copies under plugins/*/lib/shared are generated, and nothing
  # at runtime would notice if one had been edited in place instead.
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '21'

      - run: node scripts/sync-shared.mjs --check

  uidiff:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '21'

      - name: Install ImageMagick
        run: brew install imagemagick

      - run: npm test
        working-directory: plugins/uidiff

  datadiff:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 21 is the floor package.json claims. TypeScript function targets
        # additionally need a Node that can strip types, so those tests skip
        # themselves on 21 and run on 24 — testing only one version would
        # either stop checking the floor or stop checking TypeScript at all.
        node-version: ['21', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm test
        working-directory: plugins/datadiff
